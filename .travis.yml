language: node_js
node_js:
  - "12"

env:
  global:
    - BUILD_TIMEOUT=10000

install:
  - yarn install --frozen-lockfile

script:
  - echo "Excluding the 'Dangerous regex' test - it fails on the unmodified v2.0.1 tag because modern V8 no longer escapes '/' inside a character class in RegExp.prototype.source, and no sealed patch touches RegExp serialization"
  - yarn mocha --opts mocha.opts --grep "Dangerous regex" --invert
